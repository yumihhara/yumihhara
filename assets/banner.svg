<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#05070f"/>
<stop offset="0.5" stop-color="#0a1024"/>
<stop offset="1" stop-color="#12062b"/>
</linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#00f0ff"/>
<stop offset="0.5" stop-color="#7a5cff"/>
<stop offset="1" stop-color="#ff2bd6"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07"/>
</pattern>
</defs>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<rect width="1200" height="320" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="url(#neon)" stroke-width="2"/>
<g transform="translate(1030,160)" fill="none">
<circle r="95" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 12">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
</circle>
<circle r="70" stroke="#ff2bd6" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="60 30">
<animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
</circle>
<circle r="42" stroke="#7a5cff" stroke-width="2" stroke-dasharray="4 8">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
</circle>
<circle r="12" fill="#00f0ff">
<animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
</circle>
</g>
<rect x="0" y="0" width="1200" height="3" fill="#00f0ff" opacity="0.35">
<animate attributeName="y" values="0;320;0" dur="5s" repeatCount="indefinite"/>
</rect>
<g font-family="Consolas, Courier New, monospace" font-size="17" fill="#7df9ff">
<text x="60" y="62" opacity="0">&gt; INICIALIZANDO SISTEMA v2.0 ........ [OK]
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.06;0.93;1" dur="12s" repeatCount="indefinite"/>
</text>
<text x="60" y="90" opacity="0">&gt; CARREGANDO NUCLEO NEURAL ......... [OK]
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.14;0.93;1" dur="12s" repeatCount="indefinite"/>
</text>
<text x="60" y="118" opacity="0">&gt; CONECTANDO AO GITHUB ............. [OK]
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.22;0.93;1" dur="12s" repeatCount="indefinite"/>
</text>
</g>
<rect x="60" y="140" width="560" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
<rect x="60" y="140" width="0" height="8" rx="4" fill="url(#neon)">
<animate attributeName="width" values="0;0;560;560;0" keyTimes="0;0.03;0.32;0.93;1" dur="12s" repeatCount="indefinite"/>
</rect>
<text x="60" y="228" font-family="Consolas, Courier New, monospace" font-size="64" font-weight="700" fill="url(#neon)" opacity="0">SYSTEM ONLINE
<animate attributeName="opacity" values="0;0;1;0.4;1;0.7;1;1;0" keyTimes="0;0.33;0.34;0.35;0.36;0.37;0.38;0.93;1" dur="12s" repeatCount="indefinite"/>
</text>
<text x="62" y="270" font-family="Consolas, Courier New, monospace" font-size="19" fill="#9aa4c7" letter-spacing="6" opacity="0">DEV // IA // CYBERPUNK // OPEN SOURCE
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.93;1" dur="12s" repeatCount="indefinite"/>
</text>
</svg>
