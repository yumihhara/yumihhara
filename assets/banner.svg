<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="System boot banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/><stop offset="0.5" stop-color="#0a1024"/><stop offset="1" stop-color="#12062b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="0.5" stop-color="#7a5cff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .boot{font-size:17px;fill:#7df9ff}
      .ok{fill:#39ff88}
      .title{font-size:64px;font-weight:700;fill:url(#neon)}
      .sub{font-size:19px;fill:#9aa4c7;letter-spacing:6px}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="url(#neon)" stroke-opacity="0.6" stroke-width="2"/>

  <!-- HUD rings -->
  <g transform="translate(1030 160)" fill="none" filter="url(#glow)">
    <circle r="95" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="70" stroke="#ff2bd6" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="60 30">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="42" stroke="#7a5cff" stroke-width="2" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#00f0ff">
      <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
      <animate
